# OpsAssist AI — single-command reproducibility
#
#   docker compose up --build
#
# Brings up the Streamlit app, Qdrant (vector DB), ElasticSearch (BM25),
# and Postgres (used for ops-state storage in v1.x; ready for use in MVP).
#
# After `up`:
#   - Streamlit UI:           http://localhost:8501
#   - Streamlit monitoring:   http://localhost:8502
#   - Qdrant REST:            http://localhost:6333
#   - Qdrant gRPC:            localhost:6334
#   - ElasticSearch REST:     http://localhost:9200
#   - Postgres:               localhost:5432  (user=opsassist, pw=opsassist)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: opsassist/app:latest
    container_name: opsassist-app
    ports:
      - "8501:8501"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: opsassist
      ELASTIC_URL: http://elasticsearch:9200
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: opsassist
      POSTGRES_USER: opsassist
      POSTGRES_PASSWORD: opsassist
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    depends_on:
      qdrant:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    command:
      - streamlit
      - run
      - src/app.py
      - --server.address=0.0.0.0
      - --server.port=8501

  monitoring:
    image: opsassist/app:latest
    container_name: opsassist-monitoring
    profiles: ["monitoring"]
    ports:
      - "8502:8501"
    environment:
      QDRANT_URL: http://qdrant:6333
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - app
    command:
      - streamlit
      - run
      - src/monitoring.py
      - --server.address=0.0.0.0
      - --server.port=8501

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: opsassist-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: opsassist-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_storage:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"yellow\\|green\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: opsassist-postgres
    environment:
      POSTGRES_DB: opsassist
      POSTGRES_USER: opsassist
      POSTGRES_PASSWORD: opsassist
    ports:
      - "55432:5432"
    volumes:
      - pg_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsassist -d opsassist"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_storage:
  es_storage:
  pg_storage: